<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shinri Trial — блокнот отыгрыша</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;0,500;0,700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c0808; --panel:#171010; --line:#2e2020;
  --blood:#b3121f; --gold:#e8b64a; --amber:#f0a03c;
  --paper:#e8d3a3; --paper-ink:#2a1d14; --paper-dim:#7a6548;
  --display:"Montserrat","Arial Black",sans-serif;
  --body:"Golos Text","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:#f1e6d6;font:400 16px/1.5 var(--body);
  background-image:radial-gradient(ellipse at 85% -10%,rgba(240,160,60,.16),transparent 55%),radial-gradient(ellipse at 0% 110%,rgba(179,18,31,.18),transparent 50%)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100%}
/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:14px;max-height:100vh;position:sticky;top:0}
.logo{font:italic 800 28px/1 var(--display);letter-spacing:-.5px;color:#fff;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;color:var(--gold);font-size:30px}
.logo small{display:block;font:500 12px var(--body);color:#a99a88;letter-spacing:0;margin-top:4px}
.search{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0f0a0a}
.list{overflow:auto;display:flex;flex-direction:column;gap:4px;flex:1;margin:0 -6px;padding:0 6px}
.char{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;cursor:pointer;width:100%}
.char:hover{background:#211515}
.char[aria-current=true]{background:#2a1517;border-color:var(--blood)}
.ava{width:42px;height:42px;border-radius:50%;flex:none;background:#2c1b1b center/cover;display:grid;place-items:center;font:italic 800 18px var(--display);color:var(--gold);border:2px solid #3a2626;overflow:hidden}
.char b{display:block;font-weight:600;line-height:1.2}
.char span{font-size:13px;color:#a99a88}
.count{margin-left:auto;font:700 12px var(--display);background:var(--blood);color:#fff;border-radius:99px;padding:2px 8px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;background:#2a1d1d;color:#f1e6d6}
.btn:hover{background:#3a2626}
.btn.gold{background:var(--gold);color:#201505}
.btn.gold:hover{background:#f5c865}
.btn.red{background:var(--blood);color:#fff}
.btn.sm{padding:5px 10px;font-size:14px}
/* main */
main{padding:28px clamp(16px,4vw,48px) 60px;min-width:0}
.head{display:flex;align-items:center;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.head .ava{width:84px;height:84px;font-size:36px;border-color:var(--gold)}
h1{font:italic 800 clamp(30px,5vw,52px)/1 var(--display);margin:0;letter-spacing:-1px;color:#fff}
.sub{color:#a99a88;margin-top:6px}
.headbtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 14px;cursor:pointer;color:#cdbfae}
.chip[aria-pressed=true]{background:var(--amber);color:#201505;border-color:var(--amber);font-weight:600}
/* notebook paper */
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:26px clamp(16px,3vw,34px) 30px;position:relative;
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(122,101,72,.28) 31px 32px);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.sheet::before{content:"";position:absolute;left:0;right:0;top:-12px;height:14px;
  background:repeating-conic-gradient(#111 0 25%,#f0e4c4 0 50%) 0 0/14px 14px;opacity:.9;border-radius:2px 2px 0 0}
.new{display:grid;gap:10px;margin-bottom:26px;padding-bottom:22px;border-bottom:2px dashed rgba(122,101,72,.6)}
.new h2{margin:0;font:italic 800 22px var(--display)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{background:rgba(255,250,235,.7);border:1px solid #b9a577;border-radius:6px;padding:9px 11px;color:var(--paper-ink);width:100%}
.row .field{flex:1;min-width:160px}
.row select.field{flex:0 0 200px}
textarea.field{min-height:120px;resize:vertical;line-height:1.55}
.entries{display:grid;gap:18px}
.entry{background:rgba(255,250,235,.55);border:1px solid #c4b080;border-left:6px solid var(--blood);border-radius:6px;padding:14px 16px}
.entry.fav{border-left-color:var(--amber);background:rgba(255,236,190,.75)}
.etop{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.entry h3{margin:0;font:italic 800 20px/1.2 var(--display)}
.tag{font:600 13px var(--body);background:var(--paper-ink);color:var(--paper);border-radius:4px;padding:2px 9px}
.date{margin-left:auto;font-size:13px;color:var(--paper-dim)}
.etext{white-space:pre-wrap;margin:10px 0 12px;overflow-wrap:anywhere}
.eact{display:flex;gap:6px;flex-wrap:wrap}
.entry .btn{background:rgba(42,29,20,.12);color:var(--paper-ink)}
.entry .btn:hover{background:rgba(42,29,20,.25)}
.empty{padding:30px 6px;text-align:center;color:var(--paper-dim)}
.sheet .btn.gold,.sheet .btn.red{color:#fff}
.sheet .btn.gold{background:var(--paper-ink);color:var(--paper)}
.menu{display:none}
dialog{background:var(--panel);color:#f1e6d6;border:1px solid var(--blood);border-radius:12px;padding:22px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog .field{background:#0f0a0a;color:#f1e6d6;border-color:var(--line);margin-bottom:10px}
dialog h2{margin:0 0 14px;font:italic 800 22px var(--display)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 25% 0 0;z-index:10;max-height:none;transform:translateX(-102%);transition:transform .2s}
  aside.open{transform:none}
  .menu{display:inline-block;margin-bottom:14px}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="logo"><i>⚖</i><div>SHINRI TRIAL<small>блокнот отыгрыша</small></div></div>
    <input class="search" id="q" type="search" placeholder="Найти персонажа" aria-label="Найти персонажа">
    <nav class="list" id="list" aria-label="Персонажи"></nav>
    <div class="tools">
      <button class="btn gold" id="addChar">Добавить персонажа</button>
      <button class="btn" id="exp">Скачать копию</button>
      <button class="btn" id="imp">Загрузить копию</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </aside>
  <main>
    <button class="btn menu" id="menu">Персонажи</button>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle">Новый персонаж</h2>
  <input class="field" id="dName" placeholder="Имя (например, Кокичи Ома)">
  <input class="field" id="dSub" placeholder="Подпись (роль, титул, скин) — по желанию">
  <input class="field" id="dImg" placeholder="Ссылка на картинку или img/koki.jpg — по желанию">
  <div class="row" style="justify-content:flex-end">
    <button class="btn" id="dCancel">Отмена</button>
    <button class="btn gold" id="dSave">Сохранить</button>
  </div>
</dialog>

<script>
/* ===== Стартовый список. Добавляй сюда своих персонажей или используй кнопку на сайте. ===== */
const SEED = [
  {name:"Макото Наэги", sub:"Счастливчик, Сверхшкольный уровень удачи"},
  {name:"Кокичи Ома", sub:"Верховный лидер"},
  {name:"Дзюнко Эношима", sub:"Сверхшкольный уровень отчаяния"},
  {name:"Фуюко Кузурю", sub:"Будилова"},
  {name:"Пеко Пекояма", sub:"Меч в красном чехле"}
];
const TAGS = ["Основа","Реплики","Сцена","Союзы и враги","Идея","Разное"];
const KEY = "shinri-notes-v1";
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let state, cur = null, tagFilter = "Все", editing = null, editChar = null;
function load(){
  try{ state = JSON.parse(localStorage.getItem(KEY)); }catch(e){ state = null; }
  if(!state || !Array.isArray(state.chars)){
    state = {chars: SEED.map(c => ({id:uid(), name:c.name, sub:c.sub, img:"", entries:[]}))};
  }
  cur = state.chars[0] ? state.chars[0].id : null;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ alert("Не удалось сохранить в браузере. Скачай копию вручную."); } }
const $ = id => document.getElementById(id);
const ch = () => state.chars.find(c => c.id === cur);

function avaHTML(c){
  const st = c.img ? ` style="background-image:url('${esc(c.img)}')"` : "";
  return `<div class="ava"${st}>${c.img ? "" : esc((c.name||"?").trim()[0] || "?")}</div>`;
}
function renderList(){
  const q = $("q").value.trim().toLowerCase();
  $("list").innerHTML = state.chars.filter(c => c.name.toLowerCase().includes(q)).map(c =>
    `<button class="char" data-id="${c.id}" aria-current="${c.id===cur}">${avaHTML(c)}<div><b>${esc(c.name)}</b><span>${esc(c.sub||"")}</span></div>${c.entries.length?`<span class="count">${c.entries.length}</span>`:""}</button>`
  ).join("") || '<p style="color:#a99a88;padding:8px">Никого не найдено.</p>';
}
function entryHTML(e){
  if(editing === e.id){
    return `<div class="entry"><div class="new" style="border:0;margin:0;padding:0">
      <div class="row"><input class="field" id="eT" value="${esc(e.title)}" placeholder="Название варианта">
      <select class="field" id="eG">${TAGS.map(t=>`<option${t===e.tag?" selected":""}>${t}</option>`).join("")}</select></div>
      <textarea class="field" id="eX">${esc(e.text)}</textarea>
      <div class="eact"><button class="btn gold sm" data-a="saveE" data-id="${e.id}">Сохранить</button><button class="btn sm" data-a="cancelE">Отмена</button></div></div></div>`;
  }
  const d = new Date(e.ts).toLocaleDateString("ru-RU");
  return `<article class="entry${e.fav?" fav":""}"><div class="etop"><h3>${esc(e.title||"Без названия")}</h3><span class="tag">${esc(e.tag)}</span><span class="date">${d}</span></div>
    <div class="etext">${esc(e.text)}</div>
    <div class="eact"><button class="btn sm" data-a="fav" data-id="${e.id}" aria-pressed="${!!e.fav}">${e.fav?"★ Любимый":"☆ В любимые"}</button>
    <button class="btn sm" data-a="edit" data-id="${e.id}">Править</button>
    <button class="btn sm" data-a="copy" data-id="${e.id}">Копировать</button>
    <button class="btn sm" data-a="del" data-id="${e.id}">Удалить</button></div></article>`;
}
function renderView(){
  const c = ch();
  if(!c){ $("view").innerHTML = '<p>Добавь первого персонажа слева.</p>'; return; }
  const list = c.entries.filter(e => tagFilter==="Все" || e.tag===tagFilter)
    .sort((a,b)=> (b.fav?1:0)-(a.fav?1:0) || b.ts-a.ts);
  $("view").innerHTML = `
  <div class="head">${avaHTML(c)}<div><h1>${esc(c.name)}</h1><div class="sub">${esc(c.sub||"")}</div></div>
    <div class="headbtns"><button class="btn" data-a="editChar">Изменить</button><button class="btn" data-a="delChar">Удалить персонажа</button></div></div>
  <div class="filters">${["Все",...TAGS].map(t=>`<button class="chip" data-tag="${t}" aria-pressed="${t===tagFilter}">${t}</button>`).join("")}</div>
  <section class="sheet">
    <div class="new"><h2>Новый вариант отыгрыша</h2>
      <div class="row"><input class="field" id="nT" placeholder="Название (например, «Первый день суда»)">
      <select class="field" id="nG" aria-label="Раздел">${TAGS.map(t=>`<option>${t}</option>`).join("")}</select></div>
      <textarea class="field" id="nX" placeholder="Как ты играешь этого персонажа: поведение, реплики, тактика, связки с другими…"></textarea>
      <div><button class="btn gold" data-a="add">Записать вариант</button></div></div>
    <div class="entries">${list.length ? list.map(entryHTML).join("") : '<div class="empty">Здесь пока пусто. Запиши первый вариант выше.</div>'}</div>
  </section>`;
}
function render(){ renderList(); renderView(); }

/* события */
$("list").addEventListener("click", e => {
  const b = e.target.closest(".char"); if(!b) return;
  cur = b.dataset.id; tagFilter = "Все"; editing = null; render();
  $("side").classList.remove("open"); window.scrollTo(0,0);
});
$("q").addEventListener("input", renderList);
$("menu").onclick = () => $("side").classList.toggle("open");
$("view").addEventListener("click", async e => {
  const t = e.target.closest("[data-tag]");
  if(t){ tagFilter = t.dataset.tag; renderView(); return; }
  const b = e.target.closest("[data-a]"); if(!b) return;
  const c = ch(), a = b.dataset.a, en = c.entries.find(x => x.id === b.dataset.id);
  if(a==="add"){
    const text = $("nX").value.trim(), title = $("nT").value.trim();
    if(!text && !title){ $("nX").focus(); return; }
    c.entries.push({id:uid(), title, tag:$("nG").value, text, fav:false, ts:Date.now()});
    save(); render();
  }else if(a==="fav"){ en.fav = !en.fav; save(); renderView(); }
  else if(a==="edit"){ editing = en.id; renderView(); }
  else if(a==="cancelE"){ editing = null; renderView(); }
  else if(a==="saveE"){ en.title=$("eT").value.trim(); en.tag=$("eG").value; en.text=$("eX").value.trim(); editing=null; save(); renderView(); }
  else if(a==="copy"){ try{ await navigator.clipboard.writeText((en.title?en.title+"\n\n":"")+en.text); b.textContent="Скопировано"; }catch(_){ b.textContent="Не вышло"; } }
  else if(a==="del"){ if(confirm("Удалить этот вариант?")){ c.entries = c.entries.filter(x=>x!==en); save(); render(); } }
  else if(a==="editChar"){ openDlg(c); }
  else if(a==="delChar"){ if(confirm(`Удалить «${c.name}» вместе со всеми записями?`)){ state.chars = state.chars.filter(x=>x!==c); cur = state.chars[0]?.id || null; save(); render(); } }
});

/* диалог персонажа */
function openDlg(c){
  editChar = c || null;
  $("dlgTitle").textContent = c ? "Изменить персонажа" : "Новый персонаж";
  $("dName").value = c?.name || ""; $("dSub").value = c?.sub || ""; $("dImg").value = c?.img || "";
  $("dlg").showModal(); $("dName").focus();
}
$("addChar").onclick = () => openDlg(null);
$("dCancel").onclick = () => $("dlg").close();
$("dSave").onclick = () => {
  const name = $("dName").value.trim(); if(!name){ $("dName").focus(); return; }
  if(editChar){ Object.assign(editChar, {name, sub:$("dSub").value.trim(), img:$("dImg").value.trim()}); }
  else{ const c = {id:uid(), name, sub:$("dSub").value.trim(), img:$("dImg").value.trim(), entries:[]}; state.chars.push(c); cur = c.id; }
  save(); $("dlg").close(); render();
};

/* резервная копия */
$("exp").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));
  a.download = "shinri-trial-notes.json"; a.click(); URL.revokeObjectURL(a.href);
};
$("imp").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!Array.isArray(d.chars)) throw 0;
    if(!confirm("Заменить текущие записи загруженной копией?")) return;
    state = d; cur = state.chars[0]?.id || null; save(); render();
  }catch(_){ alert("Это не похоже на копию блокнота."); }
  e.target.value = "";
};

load(); render();
</script>
</body>
</html>
